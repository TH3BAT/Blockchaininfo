[package]
name = "blockchaininfo"
version = "1.4.3"
edition = "2021"
description = "Live terminal dashboard tracking critical Bitcoin metrics."
readme = "README.md"
repository = "https://github.com/TH3BAT/Blockchaininfo"
license = "MIT"
authors = ["B. Farley <bfarley68@gmail.com>"]
keywords = [
  "terminal",
  "dashboard",
  "RPC",
  "bitcoin",
  "full-node",
]

[[bin]]
name = "blockchaininfo"
path = "src/main.rs"

[lib]
name = "blockchaininfo"
path = "src/lib.rs"

# Benchmarks
[[bench]]
name = "benchmark"
harness = false

[dev-dependencies]
criterion = "0.8.1"

[dependencies]
tokio = { version = "1.53.2", features = ["full"] }

[target. 'cfg(not(target_env = "msvc"))'.dependencies]
jemallocator = "0.5"

# reqwest 0.13+ breaks Tor-based RPC stability.
# Pinned intentionally.
reqwest = { version = "0.12.24", features = ["json", "socks", "rustls-tls"] }

serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
chrono = "0.4.45"
toml = "1.1.6"
num-format = "0.4.4"
colored = "3.1.1"
crossterm = "0.29.0"
tui = "0.19.0"
regex = "1.13.1"
rand = "0.10.3"
once_cell = "1.21.4"
futures = "0.3.34"
dashmap = "6.2.1"
lazy_static = "1.5.1"
hex = "0.4.3"
rpassword = "7.5.4"
unicode-width = "0.2.2"
